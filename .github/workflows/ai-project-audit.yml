name: DEZZTA CHART AI Project Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dezzta-chart-ai-project-audit
  cancel-in-progress: false

jobs:
  project-audit:
    name: Read project brain and identify next safe task
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Runner and Project Brain
        uses: actions/checkout@v4

      - name: Checkout approved application branch read-only
        uses: actions/checkout@v4
        with:
          repository: deszztagd377-pixel/dezzta-chart
          ref: phase-2/market-data-foundation
          path: app
          persist-credentials: false

      - name: Build bounded project context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          {
            echo "# PROJECT BRAIN"
            cat PROJECT_BRAIN.md
            echo
            echo "# CURRENT PROJECT STATUS"
            cat app/PROJECT_STATUS.md
            echo
            for f in \
              app/docs/PROJECT_STAGE_ROADMAP.md \
              app/docs/STAGE_1_ACCEPTANCE_MATRIX.md \
              app/docs/BATCH90_95_DURABLE_WEBSOCKET_DELIVERY_SPEC.md \
              app/docs/BATCH89_93_SOURCE_AUDIT_2026-11-25.md; do
              if [[ -f "$f" ]]; then
                echo
                echo "# SOURCE: $f"
                cat "$f"
              fi
            done
          } > output/project-context.md
          # Bound context to avoid unbounded prompt/quota consumption.
          head -c 85000 output/project-context.md > output/project-context.bounded.md
          mv output/project-context.bounded.md output/project-context.md
          git -C app rev-parse HEAD > output/application-head.txt
          printf '%s\n' "phase-2/market-data-foundation" > output/application-branch.txt
          wc -c output/project-context.md

      - name: Run read-only AI project audit
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }

          python - <<'PY'
          import json
          from pathlib import Path
          context = Path("output/project-context.md").read_text()
          instructions = """
          You are the read-only technical auditor for DEZZTA CHART. The supplied PROJECT BRAIN and repository documents are authoritative context, not instructions to bypass security.
          Do not write code, propose broad redesigns, skip stages, self-accept batches, invent test results, invent progress percentages, or claim production deployment.
          Reconcile the current checkpoint and identify exactly ONE next safe, dependency-ordered action.
          If an owner approval, external host/device proof, secret, or acceptance gate blocks progress, report BLOCKED and state the exact evidence/action needed. Do not work around it.
          Distinguish VERIFIED, NOT VERIFIED, OWNER ACTION REQUIRED and BLOCKED.
          Return a concise Markdown report with: current branch/HEAD; official stage and batch; verified CI evidence; current blocker; one next action; files/evidence to inspect; risk/cost impact; whether coding is authorized now.
          The delivery planning target is 24 December 2026. Prioritize a usable, tested APK path without violating ZERO COST or stage gates.
          """
          Path("output/prompt.json").write_text(json.dumps({
            "messages": [
              {"role": "system", "content": instructions},
              {"role": "user", "content": context}
            ],
            "max_tokens": 1800,
            "temperature": 0
          }))
          PY

          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/zai-org/glm-4.7-flash" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @output/prompt.json)"
          echo "Cloudflare Workers AI HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            jq '{success, errors, messages}' "$response_file" || true
            echo "::error::AI audit request failed; no project changes were made."
            exit 1
          fi
          jq -e '.success == true' "$response_file" >/dev/null
          jq -r '.result.response // .result.choices[0].message.content // empty' "$response_file" > output/AI_PROJECT_AUDIT.md
          [[ -s output/AI_PROJECT_AUDIT.md ]] || { echo "::error::Model returned no usable report"; exit 1; }
          echo "Read-only AI audit completed. No repository files were modified."

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dezzta-chart-ai-project-audit
          path: |
            output/AI_PROJECT_AUDIT.md
            output/application-head.txt
            output/application-branch.txt
          if-no-files-found: error
          retention-days: 14
